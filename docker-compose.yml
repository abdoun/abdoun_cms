version: "3.8"

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: framework
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./admin_init_conf/framework.sql:/docker-entrypoint-initdb.d/framework.sql
      - ./mysql-utf8.cnf:/etc/mysql/conf.d/utf8.cnf:ro

volumes:
  db_data:
