version: "3.8"

services:
  web:
    build: .
    restart: unless-stopped
    command: 'sh -c "chmod a+w /var/www/html/public_html/sitemap.xml 2>/dev/null || true; exec apache2-foreground"'
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: framework
    volumes:
      - db_data:/var/lib/mysql
      - ./admin_init_conf/framework.sql:/docker-entrypoint-initdb.d/framework.sql
      - ./mysql-utf8.cnf:/etc/mysql/conf.d/utf8.cnf:ro

volumes:
  db_data:
