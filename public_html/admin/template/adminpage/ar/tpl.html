<script type="text/javascript">
/* Mobile navigation toggle - plain JS, independent of jQuery. */
(function () {
    var button = document.querySelector('.art-nav-toggle');
    var menu = document.querySelector('.art-nav-outer');
    if (!button || !menu) { return; }
    button.addEventListener('click', function () {
        var open = menu.classList.toggle('is-open');
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && menu.classList.contains('is-open')) {
            menu.classList.remove('is-open');
            button.setAttribute('aria-expanded', 'false');
        }
    });
    /* Admin pages load over AJAX, so close the dropdown after a choice. */
    var links = document.querySelector('.art-hmenu');
    if (links) {
        links.addEventListener('click', function (event) {
            if (event.target.closest && event.target.closest('a')) {
                menu.classList.remove('is-open');
                button.setAttribute('aria-expanded', 'false');
            }
        });
    }
})();
</script>
